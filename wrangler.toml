name = "nakarte-routing"
pages_build_output_dir = "build"
compatibility_date = "2025-09-01"

[[r2_buckets]]
binding = "TILES"
bucket_name = "nakarte-tiles"

# Rate counter for the functions /tiles/ and /brouter-wasm/ (their _middleware.js): Worker nakarte-guard from
# workers/guard. A call by service binding is not billed as a request; without the binding the functions have no limit.
[[services]]
binding = "GUARD"
service = "nakarte-guard"
