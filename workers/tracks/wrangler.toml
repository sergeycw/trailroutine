name = "nakarte-tracks"
main = "src/index.js"
compatibility_date = "2025-09-01"
# Version URLs (<version>-<worker>.nakarte-routing.workers.dev) are off for all versions: an old version
# with old limits would bypass the limits of the new one (requirement «Только основной адрес Worker'а», worker-limits).
preview_urls = false

# Workers Logs: the request history and console.log in the Cloudflare dashboard, kept for 7 days. Workers Paid
# includes 20 million events per month, after that $0.60 per million (the prices change from 2026-12-01); if the
# traffic grows, decrease head_sampling_rate (the fraction of logged requests, default 1).
[observability]
enabled = true

# The limit for one invocation: the observed CPU maximum is 2 ms, one or two R2 operations per request.
[limits]
cpu_ms = 500
subrequests = 10

[vars]
# the site of the clone, the dev server of the web/ app (8769) and vite preview (4173)
ALLOWED_ORIGINS = "https://trailroutine.com,https://nakarte-routing.pages.dev,http://localhost:8769,http://localhost:4173"

[[r2_buckets]]
binding = "TRACKS"
bucket_name = "nakarte-tracks"

# The rate from one IP (CF-Connecting-IP) per 60 s; namespace_id is unique in the account (1002–1008 are the clone,
# 1001 is free).
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1003"
simple = { limit = 60, period = 60 }

# Writes (POST) from one IP per 60 s, separate from the common counter: a write has no expiry and adds to the
# storage, and link reads must not hit this limit (change limit-track-writes).
[[ratelimits]]
name = "WRITE_RATE_LIMITER"
namespace_id = "1006"
simple = { limit = 10, period = 60 }
