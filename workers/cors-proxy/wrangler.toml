name = "nakarte-cors-proxy"
main = "src/index.js"
compatibility_date = "2025-09-01"
# Version URLs (<version>-<worker>.nakarte-routing.workers.dev) are off for all versions: an old version
# with old limits would bypass the limits of the new one (requirement «Только основной адрес Worker'а», worker-limits).
preview_urls = false

# Workers Logs: the request history and console.log in the Cloudflare dashboard, kept for 7 days. Workers Paid
# includes 20 million events per month, after that $0.60 per million (the prices change from 2026-12-01); if the
# traffic grows, decrease head_sampling_rate (the fraction of logged requests, default 1).
[observability]
enabled = true

# The limit for one invocation: the observed CPU maximum is 2 ms, one fetch per request (redirect: manual).
# A heatmap tile adds up to 4 page requests when it refreshes the Strava cookies (src/strava.js).
[limits]
cpu_ms = 500
subrequests = 50

[vars]
# the site of the clone, the dev server of the web/ app (8769) and vite preview (4173)
ALLOWED_ORIGINS = "https://trailroutine.com,https://nakarte-routing.pages.dev,http://localhost:8769,http://localhost:4173"

# Secrets (wrangler secret put, the owner sets them): STRAVA_SESSION and STRAVA_COOKIES are the heatmap cookies
# (src/strava.js), TRACESTRACK_KEY is the tile key of Tracestrack Topo (src/tracestrack.js).

# The rate from one IP (CF-Connecting-IP) per 60 s. Tile layers go through the proxy (Strava heatmap, Tsvetkov,
# Tracestrack Topo), thus the limit is higher than for the other Workers. RATE_LIMITER is for layer hosts (LAYER_HOSTS
# in src/index.js), OTHER_RATE_LIMITER is for all other hosts. namespace_id is the counter number, unique in the
# account: 1002–1008 are used by the Workers of the clone (1001 is free).
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1004"
simple = { limit = 1200, period = 60 }

[[ratelimits]]
name = "OTHER_RATE_LIMITER"
namespace_id = "1007"
simple = { limit = 300, period = 60 }
