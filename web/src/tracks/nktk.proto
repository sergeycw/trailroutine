// Schema of the nktk track string version 4: a copy of src/lib/leaflet.control.track-list/lib/parsers/nktk.proto of
// the old client with the new fields Segment.route (design add-web-autosave, «Ссылка: необязательное поле разметки»)
// and View.rgb. No code is generated: nktk.ts reads and writes by hand. Do not change the field numbers: the links
// that were given out depend on them.

syntax = "proto3";

message Segment {
    repeated sint32 lats = 1;
    repeated sint32 lons = 2;
    // route markup of the segment; no field means a plain polyline. The old client skips the field.
    SegmentRoute route = 3;
}

message SegmentRoute {
    // steps between waypoint indexes in the segment (≥ 1); the first waypoint is point 0, the last is the last point
    repeated uint32 gaps = 1;
    // one code for each leg between waypoints: 0 is straight, 2k+1 is routed with the activity activities[k],
    // 2k+2 is not routed, with the activity activities[k]
    repeated uint32 legs = 2;
    // activity ids (routing/brouter.ts) without repeats
    repeated string activities = 3;
}

message Waypoint {
    sint32 lat = 1;
    sint32 lon = 2;
    string name = 3;
}

message Waypoints {
    sint32 midLat = 1;
    sint32 midLon = 2;
    repeated Waypoint waypoints = 3;
}

message Track {
    string name = 1;
    repeated Segment segments = 2;
    Waypoints waypoints = 3;
}

message View {
    // palette color index (TRACK_COLORS); for a custom color, the nearest index, for readers without the rgb field
    int32 color = 1;
    bool shown = 2;
    bool ticksShown = 3;
    // custom track color 0xRRGGBB (design track-color-picker, «Ссылка: новое поле View.rgb»); no field means a palette
    // color from color. optional is for black: 0 is a color, not a missing value. The old client skips the field.
    optional uint32 rgb = 4;
}

message TrackView {
    View view = 1;
    Track track = 2;
}
