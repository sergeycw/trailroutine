version: 2
# Dependabot updates the workflows, the npm dependencies of the app (web/), of the services in workers/ and of the root
# lint (Biome), and the cargo dependencies of workers/elevation. Version updates also need the switch in
# Settings → Advanced Security → Dependabot version updates: this file alone is not sufficient.
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    # all the services in workers/ and the root lint: one weekly PR (the agent's decision 2026-11-07, backlog item
    # «Dependabot»)
    directories:
      - "/"
      - "/workers/tracks"
      - "/workers/feedback"
      - "/workers/elevation"
      - "/workers/cors-proxy"
      - "/workers/guard"
      - "/workers/tiles"
    schedule:
      interval: weekly
    ignore:
      # @cloudflare/vitest-pool-workers 0.22 (the latest on 2026-10-07) requires vitest ^4.1, with vitest 5
      # the tests in workerd fail; remove this when a pool for the new major comes out (bump them together)
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
    groups:
      workers-npm:
        patterns: ["*"]

  # the app: a separate block, because it uses vitest 5 and the workers keep vitest 4. Minor and patch updates go as
  # one weekly PR; a major update gets its own PR, so a break shows on its own
  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
    groups:
      web-npm:
        update-types: ["minor", "patch"]

  # worker-build is pinned in the workflows (0.8.7) for the crate worker 0.8: a bump of worker to 0.9 without
  # an update of worker-build makes npm test in check-elevation fail, and this is the check
  - package-ecosystem: cargo
    directory: "/workers/elevation"
    schedule:
      interval: weekly
    groups:
      elevation-cargo:
        patterns: ["*"]
