version: 2
# The file came from the upstream (wladich/nakarte). Dependabot updates the workflows in .github/workflows/ and the
# npm and cargo dependencies of the services in workers/ that are listed below. The repo is not a fork since
# 2026-11-07 (it left the fork network). While it was a fork, version updates needed a manual switch
# (Settings → Advanced Security → Dependabot version updates): this file alone was not sufficient.
updates:
  - package-ecosystem: github-actions
    directory: "/"
    # main.yml was the upstream workflow `check`; the change switch-to-web-app deleted it, so this exclusion has no
    # effect
    exclude-paths:
      - ".github/workflows/main.yml"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directories:
      - "/workers/tracks"
      - "/workers/elevation"
      - "/workers/cors-proxy"
    schedule:
      interval: weekly
    ignore:
      # @cloudflare/vitest-pool-workers 0.22 (the latest on 2026-10-07) requires vitest ^4.1, with vitest 5
      # the tests in workerd fail; remove this when a pool for the new major comes out (bump them together)
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
    groups:
      workers-npm:
        patterns: ["*"]

  # worker-build is pinned in the workflows (0.8.7) for the crate worker 0.8: a bump of worker to 0.9 without
  # an update of worker-build makes npm test in check-elevation fail, and this is the check
  - package-ecosystem: cargo
    directory: "/workers/elevation"
    schedule:
      interval: weekly
    groups:
      elevation-cargo:
        patterns: ["*"]
