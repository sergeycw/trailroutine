name: strava heatmap check

# Once a day checks that the proxy serves a heatmap tile with the cookies that it gets from the session STRAVA_SESSION.
# A failure = GitHub sends an email: the Strava session is dead, or Strava changed how it issues the cookies.
# What to look at: `npx wrangler@4 tail` in workers/cors-proxy, lines «strava heatmap cookies not refreshed»;
# a new session — scripts/strava-session-secret.mjs (AGENTS.md, the item about Strava heatmap).
# Actions run on a schedule only from the default branch; after 60 days without commits GitHub
# disables the schedule.

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

jobs:
  check:
    if: github.repository == 'sergeycw/trailroutine'
    runs-on: ubuntu-latest
    steps:
      - name: heatmap tile through the proxy uses the session
        run: |
          # tile of Tbilisi z12, it surely has tracks; Origin is the clone, else the proxy answers 403
          url="https://nakarte-cors-proxy.nakarte-routing.workers.dev/https/content-a.strava.com/identified/globalheat/all/hot/12/2557/1514.png?px=256&check=$(date +%s)"
          for attempt in 1 2 3; do
            if curl -sS -o /dev/null -D headers.txt -H 'Origin: https://trailroutine.com' "$url"; then
              break
            fi
            sleep 10
          done
          status=$(head -1 headers.txt | tr -d '\r')
          type=$(grep -i '^content-type:' headers.txt | tr -d '\r' | cut -d' ' -f2)
          source=$(grep -i '^x-strava-cookies:' headers.txt | tr -d '\r' | cut -d' ' -f2)
          echo "$status, $type, cookies from $source"
          if [ "$source" != "session" ] || [[ "$type" != image/* ]]; then
            echo "::error::proxy does not serve heatmap tiles with session cookies (cookies from '$source', $status)"
            exit 1
          fi
