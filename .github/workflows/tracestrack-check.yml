name: tracestrack check

# Once a day checks that the proxy serves a Tracestrack Topo tile (the basemap that the user selects, and the fallback
# when OpenFreeMap fails, design openfreemap-default-basemap) with the key from the secret TRACESTRACK_KEY of the
# Worker nakarte-cors-proxy (design add-outdoor-basemap).
# 503 — the key is not set yet: a warning, the run is green (owner step: npx wrangler@4 secret put TRACESTRACK_KEY
# from workers/cors-proxy). All else — a red run and an email: 403 — the key is rejected or the free quota is used up
# (100 thousand tiles per month), 429 — the rate limit. While the key does not work, the app shows OpenStreetMap with
# a toast.
# Actions run on a schedule only from the default branch; after 60 days without commits GitHub
# disables the schedule.

on:
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:

jobs:
  check:
    if: github.repository == 'sergeycw/trailroutine'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Tracestrack tile through the proxy
        run: |
          # tile of Tbilisi z12, one credit of the quota; Origin is the clone, else the proxy answers 403
          url="https://nakarte-cors-proxy.nakarte-routing.workers.dev/https/tile.tracestrack.com/topo_en/12/2557/1514.webp"
          for _ in 1 2 3; do
            if curl -sS --max-time 30 -o body.txt -D headers.txt -H 'Origin: https://trailroutine.com' "$url"; then
              break
            fi
            sleep 10
          done
          if [ ! -s headers.txt ]; then
            echo "::error::proxy did not answer"
            exit 1
          fi
          status=$(head -1 headers.txt | tr -d '\r' | cut -d' ' -f2)
          type=$(grep -i '^content-type:' headers.txt | tr -d '\r' | cut -d' ' -f2)
          echo "status $status, $type"
          if [ "$status" = 503 ] && grep -q 'Tracestrack key is not set' body.txt; then
            echo "::warning::TRACESTRACK_KEY is not set: the app falls back to OpenStreetMap"
            exit 0
          fi
          if [ "$status" != 200 ] || [[ "$type" != image/* ]]; then
            # the step does not print the body: the Actions log is public, and the error text could contain the key
            echo "::error::proxy does not serve Tracestrack tiles (status $status, $type)"
            exit 1
          fi
