name: check elevation

on:
  push:
    branches: [master]
    paths:
      - 'workers/elevation/**'
      - '.github/workflows/check-elevation.yml'
  pull_request:
    paths:
      - 'workers/elevation/**'
      - '.github/workflows/check-elevation.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/elevation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rustup on the runner installs the version, the wasm32 target and the components from rust-toolchain.toml
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: workers/elevation
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p elevation-worker --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test --workspace
      # known vulnerabilities of the crates (RustSec) fail the check (security audit, P3); cargo-audit is pinned as
      # worker-build is
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit
      - run: cargo install worker-build --version 0.8.7 --locked
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: workers/elevation/package-lock.json
      - run: npm ci
      # builds the wasm for wasm32 and runs it in workerd with a local R2
      - run: npm test
