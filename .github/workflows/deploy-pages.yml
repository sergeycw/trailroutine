name: deploy pages

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-pages
  cancel-in-progress: true

# The Cloudflare secrets are only in the env of the steps with wrangler: the dependency install, the tests and the build
# run without them (requirement «Секреты только у шагов публикации», clone-deploy). The wrangler version is exact: npx
# does not get a new 4.x on each deploy; update it here.
env:
  WRANGLER: wrangler@4.148.0
  # sentry-cli for the source maps (design add-error-tracking): an exact version for the same reason
  SENTRY_CLI: '@sentry/cli@3.8.2'
  # the BRouter image of the engine files (brouter.jar and the profiles with lookups.dat) is pinned by digest: the tag
  # nightly moves, and a new jar or lookups.dat would reach production without a review, possibly out of step with the
  # tiles in R2 (backlog, «Отложено»). This digest of nightly has the same brouter.jar as production on 2026-11-07.
  # To update: docker buildx imagetools inspect ghcr.io/abrensch/brouter:nightly, put the new index digest here, and
  # check that scripts/brouter-tiles-sync.mjs still accepts lookups.dat of brouter.de.
  BROUTER_IMAGE: ghcr.io/abrensch/brouter@sha256:9374d48c68e83b6ba6f6dded50ff8a76de27193329df0faa9f6666d25affba0e

permissions:
  contents: read
  # gh run list in job changes: finds the last successful deploy
  actions: read

jobs:
  # What to deploy: the services whose files changed since the last successful run of this workflow.
  # The base is the successful run, not github.event.before: a run that a new push cancelled
  # (cancel-in-progress), or a run that failed, did not deploy its changes, and the next run takes them.
  # A manual run, a change of this file or an unknown base deploys everything.
  changes:
    if: github.repository == 'sergeycw/trailroutine'
    runs-on: ubuntu-latest
    outputs:
      pages: ${{ steps.diff.outputs.pages }}
      cors_proxy: ${{ steps.diff.outputs.cors_proxy }}
      tracks: ${{ steps.diff.outputs.tracks }}
      feedback: ${{ steps.diff.outputs.feedback }}
      elevation: ${{ steps.diff.outputs.elevation }}
      guard: ${{ steps.diff.outputs.guard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          all() {
            echo "deploy everything: $1"
            printf 'pages=true\ncors_proxy=true\ntracks=true\nfeedback=true\nelevation=true\nguard=true\n' >> "$GITHUB_OUTPUT"
          }
          if [ "$EVENT" = workflow_dispatch ]; then all 'manual run'; exit 0; fi
          base=$(gh run list --workflow deploy-pages.yml --branch master --status success --limit 1 \
            --json headSha --jq '.[0].headSha // ""')
          if [ -z "$base" ] || ! git merge-base --is-ancestor "$base" HEAD; then all "no base ($base)"; exit 0; fi
          changed=$(git diff --name-only "$base" HEAD)
          echo "changed since $base:"; echo "$changed"
          if echo "$changed" | grep -qx '.github/workflows/deploy-pages.yml'; then all 'workflow changed'; exit 0; fi
          has() { echo "$changed" | grep -qE "$1" && echo true || echo false; }
          {
            echo "cors_proxy=$(has '^workers/cors-proxy/')"
            echo "tracks=$(has '^workers/tracks/')"
            echo "feedback=$(has '^workers/feedback/')"
            echo "elevation=$(has '^workers/elevation/')"
            echo "guard=$(has '^workers/guard/')"
            # site: all, except the Workers, documents and other workflows: the app web/, functions/, engine files
            echo "pages=$(echo "$changed" | grep -vE '^(workers/(cors-proxy|tracks|feedback|elevation|guard)/|docs/|openspec/|\.github/)|\.md$' | grep -q . && echo true || echo false)"
          } | tee -a "$GITHUB_OUTPUT"

  cors-proxy:
    needs: changes
    if: needs.changes.outputs.cors_proxy == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/cors-proxy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: workers/cors-proxy/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx --yes $WRANGLER deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  tracks:
    needs: changes
    if: needs.changes.outputs.tracks == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/tracks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: workers/tracks/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx --yes $WRANGLER deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # the feedback service (change add-feedback): the email address of the owner is the secret FEEDBACK_TO of the
  # Worker, the owner sets it once (npx wrangler@4 secret put FEEDBACK_TO from workers/feedback)
  feedback:
    needs: changes
    if: needs.changes.outputs.feedback == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/feedback
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: workers/feedback/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx --yes $WRANGLER deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  elevation:
    needs: changes
    if: needs.changes.outputs.elevation == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/elevation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: workers/elevation
      - run: cargo test --workspace
      - run: cargo install worker-build --version 0.8.7 --locked
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: workers/elevation/package-lock.json
      - run: npm ci
      # npm test builds the wasm and runs it in workerd; wrangler deploy builds it again
      # with the command [build] from wrangler.toml
      - run: npm test
      - run: npx --yes $WRANGLER deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # Rate counter of the Pages Functions (service binding GUARD); closed from outside, deploys before Pages.
  guard:
    needs: changes
    if: needs.changes.outputs.guard == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/guard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: workers/guard/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx --yes $WRANGLER deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # Pages after the Workers: on a contract change the new client must not go to the old service,
  # and the binding GUARD must not point to a Worker that does not exist.
  # If a Worker deploy fails, Pages do not deploy; skipped Workers do not block it.
  pages:
    needs: [changes, cors-proxy, tracks, feedback, elevation, guard]
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.pages == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      # the tests of the Pages Functions (functions/tiles, functions/brouter-wasm) are in workers/tiles
      - name: test pages functions
        working-directory: workers/tiles
        run: |
          npm ci
          npm test
      - name: build brouter engine files
        run: |
          docker create --name brouter "$BROUTER_IMAGE"
          BROUTER_CONTAINER=brouter sh experiments/wasm/cheerpj/build.sh
      # The app web/ goes to the root of build/ (openspec/specs/web-client, design switch-to-web-app); its build puts
      # the engine files from experiments/wasm/cheerpj/ there too (plugin engineFiles). Vitest and e2e as in
      # check-web.yml (lint and types are also there, on the PR), e2e on the build that goes to publication; if they
      # fail, Pages do not publish.
      - name: web install
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: web test
        working-directory: web
        run: npm test
      # The Maps JavaScript API key for the Street View window goes only to this step (the dependency install and the
      # tests run without it; spec clone-deploy, «Ключ Google только шагу сборки»). Without the secret the key is empty,
      # the mode without a key; with the secret the key is in the bundle, and the referrer and API restrictions in
      # Google Cloud protect it.
      # The Sentry DSN also goes only to this step (spec clone-deploy, «Секреты Sentry только своим шагам»): the DSN is
      # visible in the bundle, the secret is the switch of the tracker; without it the build does not go to Sentry
      - name: web build
        working-directory: web
        run: npm run build
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      - name: check engine files are in the build
        run: test -f build/brouter-wasm/lib/brouter.jar && test -f build/brouter-wasm/profiles/lookups.dat
      # The Debug ID links a bundle file to its map in Sentry. The step injects it before e2e, so e2e check exactly what
      # deploys; it does not need a token. Only build/assets: the engine files in brouter-wasm have no maps
      - name: inject sentry debug ids
        run: npx --yes $SENTRY_CLI sourcemaps inject build/assets
      - name: web e2e
        working-directory: web
        # only Chromium: the deploy runs on Linux (docker for the engine files), and the Linux WebKit does not open the
        # Base UI menus; the project ipad-webkit runs in check-web.yml on macOS before the merge
        run: npm run e2e -- --project=chromium
      # The Sentry token goes only to this step: a Vite plugin would upload the maps from the build, where the
      # dependency code runs (design add-error-tracking, «Карты исходников»). Without the token the step skips the
      # upload; a failed upload (Sentry failure, no SENTRY_ORG) does not stop the deploy: the stack in Sentry has no
      # sources then, but the site deploys
      - name: upload source maps to sentry
        continue-on-error: true
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo 'no SENTRY_AUTH_TOKEN: source maps are not uploaded'
            exit 0
          fi
          npx --yes $SENTRY_CLI sourcemaps upload build/assets
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
      # the maps do not go to Pages in any case (spec clone-deploy, «Карты исходников не публикуются»)
      - name: remove source maps from the build
        run: |
          find build -name '*.map' -delete
          test -z "$(find build -name '*.map')"
      # A *.nakarte.me host in the bundle is a call to the author infrastructure: the deploy stops
      # (requirement «Бандл без адресов автора» in openspec/specs/clone-deploy). On a PR check-web.yml checks the same.
      - name: check no author hosts in the build
        run: node scripts/check-no-author-hosts.mjs build
      - run: npx --yes $WRANGLER pages deploy build --project-name nakarte-routing --branch master
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # Each old deploy answers on https://<hash>.nakarte-routing.pages.dev with its own functions,
  # that is without the new limits: keep only the current one (requirement «Только текущий деплой Pages»,
  # clone-deploy). A separate job: a cleanup failure does not mark the deploy as failed. The current one is the
  # canonical_deployment of the project with the commit of this run; if it does not match, delete nothing. curl, not
  # wrangler pages deployment delete: that command can ask for a confirmation.
  # !cancelled() is mandatory: without a status function GitHub adds success() implicitly, a skipped Worker
  # goes along the chain through pages, and prune was skipped in each run without Workers
  # (archive fix-prune-after-skipped-workers).
  prune:
    needs: pages
    if: ${{ !cancelled() && needs.pages.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: delete old pages deployments
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/nakarte-routing"
          call() { curl -sS --fail-with-body -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$@"; }
          project=$(call "$api")
          current=$(echo "$project" | jq -r '.result.canonical_deployment.id // empty')
          commit=$(echo "$project" | jq -r '.result.canonical_deployment.deployment_trigger.metadata.commit_hash // empty')
          # the current deploy must be the one just published, else the job would delete the new one, not the old ones
          if [ -z "$current" ] || [ "$commit" != "$GITHUB_SHA" ]; then
            echo "current deployment ${current:-unknown} is from ${commit:-unknown}, not $GITHUB_SHA: nothing deleted"
            exit 1
          fi
          echo "current deployment: $current"
          # first the full list, then the deletion: a deletion during the listing would shift the pages
          pages=$(call "$api/deployments?per_page=25" | jq -r '.result_info.total_pages')
          ids=""
          for page in $(seq 1 "$pages"); do
            ids="$ids $(call "$api/deployments?per_page=25&page=$page" | jq -r '.result[].id')"
          done
          deleted=0
          for id in $ids; do
            [ "$id" = "$current" ] && continue
            call -X DELETE "$api/deployments/$id?force=true" > /dev/null
            deleted=$((deleted + 1))
          done
          echo "deleted $deleted old deployments"

  # Production check after the deploy of at least one service; the same workflow also runs once a day.
  smoke:
    needs: [changes, cors-proxy, tracks, feedback, elevation, guard, pages]
    if: >-
      ${{ !cancelled() && !failure() && (needs.changes.outputs.pages == 'true'
      || needs.changes.outputs.cors_proxy == 'true' || needs.changes.outputs.tracks == 'true'
      || needs.changes.outputs.feedback == 'true'
      || needs.changes.outputs.elevation == 'true' || needs.changes.outputs.guard == 'true') }}
    uses: ./.github/workflows/prod-check.yml
    with:
      settle_seconds: 60
