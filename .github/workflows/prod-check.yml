name: prod check

# Synthetic check of the own services of the clone in production (scripts/prod-check.sh): once a day and after
# each deploy (job smoke in deploy-pages.yml). A failure = GitHub sends an email; what broke is
# in the step log, lines FAIL. After 60 days without commits GitHub disables the schedule.

on:
  schedule:
    - cron: '40 5 * * *'
  workflow_dispatch:
  workflow_call:
    inputs:
      # pause before the check, s: in the first tens of seconds after a publication Pages answers 500 on the static
      # files and in the functions (deploys 2026-10-29 and 2026-10-30, AGENTS.md, «Подвохи клона»)
      settle_seconds:
        type: number
        default: 0

jobs:
  check:
    if: github.repository == 'sergeycw/trailroutine'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: inputs.settle_seconds > 0
        run: sleep ${{ inputs.settle_seconds }}
      - run: sh scripts/prod-check.sh
