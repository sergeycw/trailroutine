name: check web

# The app web/ (openspec/specs/web-client): lint, types, Vitest (unit and browser mode),
# build, check of the bundle for the author hosts, Playwright e2e. The tests do not go to the network. The deploy
# runs the same tests before the Pages publication (deploy-pages.yml, job pages).

on:
  push:
    branches: [master]
    paths:
      - 'web/**'
      - 'scripts/check-no-author-hosts.mjs'
      - '.github/workflows/check-web.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'scripts/check-no-author-hosts.mjs'
      - '.github/workflows/check-web.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # the Playwright browsers are not cached: its documentation recommends this (playwright.dev/docs/ci)
      - run: npx playwright install --with-deps chromium webkit
      - run: npx biome ci
      - run: npm run typecheck
      - run: npm test
      # fake DSN (the DSN format, not a secret): the e2e of the error tracker run only on a build with a DSN, a stub
      # replaces the Sentry intake (e2e/clone-monitoring.spec.ts)
      - run: npm run build
        env:
          VITE_SENTRY_DSN: https://public@o0.ingest.sentry.io/0
      - run: node ../scripts/check-no-author-hosts.mjs ../build
      - run: npm run e2e
