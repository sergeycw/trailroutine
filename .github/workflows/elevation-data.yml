name: elevation data

# Manual repack of the viewfinderpanoramas HGT 3″ into the R2 bucket `nakarte-elevation`
# (workers/elevation/scripts/elevation-data.sh). The upload goes through the R2 S3 API with a token with the permission
# Object Read & Write on this bucket (secrets R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY);
# the script skips the degrees that are already in the bucket, so you can restart an interrupted run.

on:
  workflow_dispatch:
    inputs:
      zips:
        description: 'zip на viewfinderpanoramas.org без .zip через пробел (dem3/K38 dem3/L32) или all'
        required: true
        default: 'dem3/K38 dem3/K37 dem3/L32 dem3/G45'

concurrency:
  group: elevation-data
  cancel-in-progress: false

jobs:
  repack:
    if: github.repository == 'sergeycw/trailroutine'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    defaults:
      run:
        working-directory: workers/elevation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: workers/elevation
      - run: cargo build --release -p elevation-repack
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      # the list goes through env, not through substitution in run: thus the input does not get into the script text
      - run: scripts/elevation-data.sh $ZIPS
        env:
          ZIPS: ${{ github.event.inputs.zips }}
          R2_MODE: --remote
          R2_ENDPOINT: https://1f81a3ec34abfc6581cdd0484bbf56a9.r2.cloudflarestorage.com
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
